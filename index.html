<!DOCTYPE html>
<html lang="it">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Partita del gruppo</title>
  <style>
    :root {
      --bg: #f4f6f2;
      --card: #fff;
      --tx: #1b2418;
      --mu: #67725f;
      --ac: #2e7d32;
      --ac2: #e8f3e8;
      --bd: #dfe5da;
      --wa: #25d366;
      --mp: #1a73e8;
      --er: #c62828;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #121712;
        --card: #1c231b;
        --tx: #eaf0e6;
        --mu: #93a08a;
        --ac: #66bb6a;
        --ac2: #243325;
        --bd: #2e392c;
      }
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--tx);
      font: 16px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif;
    }

    main {
      max-width: 520px;
      margin: 0 auto;
      padding: 14px;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--bd);
      border-radius: 14px;
      padding: 14px;
      margin-bottom: 12px;
    }

    h1 {
      font-size: 20px;
      margin: 0 0 2px;
    }

    h2 {
      font-size: 15px;
      margin: 0 0 8px;
    }

    .mu {
      color: var(--mu);
      font-size: 14px;
    }

    .row {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      align-items: center;
    }

    .big {
      font-size: 34px;
      font-weight: 700;
      color: var(--ac);
    }

    button,
    input,
    select,
    a.wa,
    a.mp {
      font: inherit;
      border-radius: 10px;
      border: 1px solid var(--bd);
      padding: 10px 12px;
      background: var(--card);
      color: var(--tx);
    }

    input,
    select {
      width: 100%;
      margin-bottom: 8px;
    }

    button {
      cursor: pointer;
      font-weight: 600;
    }

    button.p {
      background: var(--ac);
      color: #fff;
      border-color: var(--ac);
    }

    button.sm {
      padding: 4px 8px;
      font-size: 13px;
      font-weight: 500;
    }

    a.wa,
    a.mp {
      text-decoration: none;
      display: inline-block;
      font-weight: 600;
    }

    a.wa {
      background: var(--wa);
      color: #000;
      border-color: var(--wa);
    }

    a.mp {
      background: transparent;
      color: var(--mp);
      border-color: var(--mp);
    }

    button.d {
      color: var(--er);
    }

    .grow {
      flex: 1;
    }

    ol {
      margin: 0;
      padding-left: 22px;
    }

    li {
      padding: 4px 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    li .lbl {
      flex: 1;
    }

    li.me .lbl {
      font-weight: 700;
      color: var(--ac);
    }

    li.guest .lbl::after {
      content: " (ospite)";
      font-weight: 400;
      color: var(--mu);
      font-size: 12px;
    }

    .err {
      color: var(--er);
      font-size: 14px;
      min-height: 18px;
    }

    .note {
      background: var(--ac2);
      border-radius: 10px;
      padding: 10px;
      margin-top: 8px;
      font-size: 14px;
    }

    .bar {
      height: 8px;
      background: var(--ac2);
      border-radius: 5px;
      overflow: hidden;
      margin-top: 6px;
    }

    .bar i {
      display: block;
      height: 100%;
      background: var(--ac);
    }

    .ghost {
      background: transparent;
      border-style: dashed;
    }
  </style>
</head>

<body>
  <main>
    <div class="card" id="head">Caricamento…</div>
    <div class="card" id="auth"></div>
    <div id="notice"></div>

    <div class="card">
      <h2>⚽ In campo</h2>
      <ol id="conf"></ol>
    </div>

    <div class="card">
      <h2>🪑 Riserve / sostituti</h2>
      <ol id="res"></ol>
      <div class="mu" id="resHint"></div>
    </div>

    <div class="card" id="admin" hidden></div>
  </main>

  <script type="module">
    import { firebaseConfig } from "./firebase-config.js";
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
    import {
      getAuth,
      onAuthStateChanged,
      createUserWithEmailAndPassword,
      signInWithEmailAndPassword,
      signOut
    } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
    import {
      getFirestore,
      doc,
      getDoc,
      setDoc,
      updateDoc,
      deleteDoc,
      collection,
      onSnapshot,
      serverTimestamp,
      writeBatch
    } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";


    /* ============================================================
       CONFIG
       (firebaseConfig now lives in firebase-config.js, which is
       NOT committed to the repo — see README)
       ============================================================ */

    const ADMIN = "altair9510";                       // must match the Firestore rules
    const LAT = 41.87242232597652;                    // pitch latitude (weather)
    const LON = 12.551317829923443;                   // pitch longitude (weather)
    const DOMAIN = "@partita.app";                    // fake email domain for usernames


    /* ============================================================
       STATE
       ============================================================ */

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    const DEF = {
      time: "21:00",
      place: "Centro Sportivo Certosa",
      cap: 10,
      date: "",
      maps: ""
    };

    let match = { ...DEF };
    let entries = [];      // { id, type: "member"|"guest", role, ts, username?, addedBy?, nome?, cognome? }
    let players = {};      // username -> { nome, cognome }
    let me = null;
    let weather = "";
    let guestFormOpen = false;
    let registerStep = false;   // true = we're on the "nome/cognome" step of a new registration
    let regUsername = "";
    let regPassword = "";


    /* ============================================================
       HELPERS
       ============================================================ */

    const $ = id => document.getElementById(id);

    const esc = s => String(s).replace(/[&<>"]/g, c => ({
      "&": "&amp;",
      "<": "&lt;",
      ">": "&gt;",
      '"': "&quot;"
    }[c]));

    // "2026-10-01" -> "01/10"
    const fmt = d => d
      ? d.split("-").reverse().slice(0, 2).join("/")
      : "";

    // "YYYY-MM-DD" -> "Giovedì" / "Martedì" / ... (parsed as a local date, no TZ shift)
    function dayName(dateStr) {
      if (!dateStr) return "";
      const giorni = ["Domenica", "Lunedì", "Martedì", "Mercoledì", "Giovedì", "Venerdì", "Sabato"];
      const [y, m, d] = dateStr.split("-").map(Number);
      return giorni[new Date(y, m - 1, d).getDay()];
    }

    // "Partita di Martedì 30/09" — falls back gracefully if no date is set yet
    function matchTitle(dateStr) {
      const dn = dayName(dateStr);
      return dn ? `Partita di ${dn} ${fmt(dateStr)}` : "Partita";
    }

    // Display name for any entry (member or guest)
    function displayName(e) {
      if (e.type === "guest") {
        return `${e.nome} ${e.cognome}`;
      }
      const p = players[e.username];
      return p ? `${p.nome} ${p.cognome}` : `@${e.username}`;
    }

    function myDisplayName() {
      const p = players[me];
      return p ? `${p.nome} ${p.cognome}` : `@${me}`;
    }

    // Splits entries into "in campo" (conf) and "riserve" (res).
    // Players beyond the cap wait first, then declared substitutes.
    function derive(list, cap) {
      const playersIn = list
        .filter(e => e.role === "player")
        .sort((a, b) => a.ts - b.ts);

      const subs = list
        .filter(e => e.role === "sub")
        .sort((a, b) => a.ts - b.ts);

      return {
        conf: playersIn.slice(0, cap),
        res: playersIn.slice(cap).concat(subs)
      };
    }

    // How many players are currently on the pitch, ignoring one entry id
    // (used before adding/switching someone into "player")
    function playerCountExcluding(id) {
      return entries.filter(e => e.role === "player" && e.id !== id).length;
    }

    const err = t => {
      const e = $("err");
      if (e) e.textContent = t;
    };

    const gerr = t => {
      const e = $("gerr");
      if (e) e.textContent = t;
    };


    /* ============================================================
       RENDER
       ============================================================ */

    function render() {
      const { conf, res } = derive(entries, match.cap);
      const pct = Math.min(100, conf.length / match.cap * 100);
      const mine = me && entries.find(e => e.type === "member" && e.username === me);

      // ----- Match header -----
      $("head").innerHTML = `
        <h1>${esc(matchTitle(match.date))}</h1>

        <div class="row" style="justify-content: space-between;">
          <div class="mu">📍 ${esc(match.place)} · 🕘 ${esc(match.time)}</div>
          ${match.maps ? `
            <div class="row" style="gap: 6px;">
              <a class="mp sm" style="padding:4px 8px;font-size:13px;" target="_blank" rel="noopener" href="${esc(match.maps)}">🗺️ Mappa</a>
              <button class="sm" id="copyMaps">📋 Copia link</button>
            </div>
          ` : ""}
        </div>

        <div class="row" style="align-items: baseline; margin-top: 6px;">
          <span class="big">${conf.length}/${match.cap}</span>
          <span class="mu">giocatori · ${res.length} in panchina</span>
        </div>

        <div class="bar">
          <i style="width: ${pct}%"></i>
        </div>

        ${weather ? `<div class="note">${weather}</div>` : ""}
      `;

      if (match.maps) {
        $("copyMaps").onclick = async () => {
          try {
            await navigator.clipboard.writeText(match.maps);
            $("copyMaps").textContent = "✅ Copiato";
            setTimeout(() => { $("copyMaps").textContent = "📋 Copia link"; }, 1500);
          }
          catch (e) {
            prompt("Copia il link:", match.maps);
          }
        };
      }

      // ----- Login / user box -----
      if (!me && !registerStep) {
        // Single flow: try to sign in first. We only find out it's a brand
        // new account if the sign-in fails — see continueAuth() below.
        $("auth").innerHTML = `
          <h2>Entra con il tuo username</h2>

          <input
            id="u"
            placeholder="username (unico)"
            autocapitalize="none"
            autocomplete="username"
            value="${esc(regUsername)}">

          <input
            id="pw"
            type="password"
            placeholder="password (min. 6 caratteri)"
            autocomplete="current-password"
            value="${esc(regPassword)}">

          <button class="p grow" id="go">Accedi</button>
          <div class="mu" style="margin: 6px 0 0;">Se non hai ancora un account, te ne creiamo uno al volo.</div>

          <div class="err" id="err"></div>
        `;

        $("go").onclick = () => continueAuth();
      }
      else if (!me && registerStep) {
        // Only reached when sign-in failed AND the account turned out not to exist yet.
        $("auth").innerHTML = `
          <h2>Benvenuto! Come ti chiami?</h2>
          <div class="mu" style="margin: -4px 0 8px;">Username: @${esc(regUsername)}</div>

          <div class="row">
            <input id="nome" placeholder="Nome" style="flex: 1;">
            <input id="cognome" placeholder="Cognome" style="flex: 1;">
          </div>

          <div class="row">
            <button class="p grow" id="confirmReg">Conferma registrazione</button>
            <button class="grow" id="backReg">Indietro</button>
          </div>

          <div class="err" id="err"></div>
        `;

        $("confirmReg").onclick = () => finishRegister();
        $("backReg").onclick = () => {
          registerStep = false;
          render();
        };
      }
      else {
        let status;
        if (!mine) {
          status = "Non sei iscritto";
        }
        else if (mine.role === "sub") {
          status = "Sei sostituto";
        }
        else if (conf.find(e => e.id === mine.id)) {
          status = "Sei in campo ✅";
        }
        else {
          status = "Sei in lista d'attesa";
        }

        $("auth").innerHTML = `
          <div class="row" style="justify-content: space-between; align-items: center;">
            <div>
              <b>${esc(myDisplayName())}</b>
              <div class="mu">${status}</div>
            </div>
            <button id="out">Esci</button>
          </div>

          <div class="row" style="margin-top: 10px;" id="acts"></div>

          <div class="row" style="margin-top: 6px;">
            <button class="ghost grow sm" id="gtoggle">${guestFormOpen ? "✕ Annulla" : "+ Aggiungi giocatore esterno"}</button>
          </div>

          <div id="gformBox"></div>

          <div class="err" id="err"></div>
        `;

        $("out").onclick = () => signOut(auth);

        // Small helper: adds an action button to the row
        const addButton = (text, cls, onClick) => {
          const btn = document.createElement("button");
          btn.textContent = text;
          btn.className = cls + " grow";
          btn.onclick = onClick;
          $("acts").append(btn);
        };

        if (!mine) {
          addButton("Ci sono!", "p", () => join("player"));
          addButton("Sostituto", "", () => join("sub"));
        }
        else {
          addButton("Ritirati", "d", leave);

          if (mine.role === "sub") {
            addButton("Passa a giocatore", "p", () => join("player"));
          }
          else {
            addButton("Passa a sostituto", "", () => join("sub"));
          }
        }

        $("gtoggle").onclick = () => {
          guestFormOpen = !guestFormOpen;
          render();
        };

        if (guestFormOpen) {
          $("gformBox").innerHTML = `
            <div class="card" style="margin-top: 8px; padding: 10px;">
              <div class="row">
                <input id="g_nome" placeholder="Nome" style="flex: 1;">
                <input id="g_cognome" placeholder="Cognome" style="flex: 1;">
              </div>
              <select id="g_role">
                <option value="player">Giocatore</option>
                <option value="sub">Sostituto</option>
              </select>
              <button class="p grow" id="g_add">Aggiungi</button>
              <div class="err" id="gerr"></div>
            </div>
          `;
          $("g_add").onclick = addGuest;
        }
      }

      // ----- Player lists -----
      const listItems = arr =>
        arr
          .map(e => {
            const isMine = e.type === "member" && e.username === me;
            const isMyGuest = e.type === "guest" && e.addedBy === me;
            const canManage = isMyGuest || (e.type === "guest" && me === ADMIN);

            const manageBtns = canManage ? `
              <button class="sm" onclick="__toggleGuestRole('${e.id}')">⇄</button>
              <button class="sm d" onclick="__removeGuest('${e.id}')">✕</button>
            ` : "";

            return `
              <li class="${isMine ? "me" : ""} ${e.type === "guest" ? "guest" : ""}">
                <span class="lbl">${esc(displayName(e))}</span>
                ${manageBtns}
              </li>
            `;
          })
          .join("")
        || `<li class="mu" style="list-style: none;">— nessuno —</li>`;

      $("conf").innerHTML = listItems(conf);
      $("res").innerHTML = listItems(res);
      $("resHint").textContent = res.length
        ? "Il primo della lista entra se qualcuno si ritira."
        : "";

      // ----- Admin panel (built once per login / match update) -----
      const adminBox = $("admin");
      const isAdmin = (me === ADMIN);
      adminBox.hidden = !isAdmin;

      if (isAdmin && !adminBox.dataset.on) {
        adminBox.dataset.on = 1;

        adminBox.innerHTML = `
          <h2>⚙️ Organizzatore</h2>

          <input id="a_date" type="date">
          <input id="a_place" placeholder="Luogo">
          <input id="a_maps" placeholder="Link Google Maps (facoltativo)">

          <div class="row">
            <input id="a_time" placeholder="Ora" style="flex: 1;">
            <input id="a_cap" type="number" min="2" placeholder="N. giocatori" style="flex: 1;">
          </div>

          <div class="row">
            <button class="p grow" id="a_save">Salva e avvisa</button>
            <button class="d" id="a_reset">Nuova settimana</button>
          </div>

          <div class="mu">“Nuova settimana” azzera gli iscritti.</div>
        `;

        $("a_date").value = match.date || new Date().toISOString().slice(0, 10);
        $("a_place").value = match.place;
        $("a_maps").value = match.maps || "";
        $("a_time").value = match.time;
        $("a_cap").value = match.cap;

        $("a_save").onclick = () => saveMatch(false);
        $("a_reset").onclick = () => saveMatch(true);
      }
    }

    // Shows the "send on WhatsApp" card with a prefilled message.
    // Only ever called right after an actual change (join/leave/guest/admin save).
    function say(msg) {
      $("notice").innerHTML = `
        <div class="card">
          <div class="mu">Avvisa il gruppo WhatsApp:</div>

          <div style="margin: 6px 0;">${esc(msg)}</div>

          <a class="wa"
             target="_blank"
             rel="noopener"
             href="https://wa.me/?text=${encodeURIComponent(msg)}">
            Invia su WhatsApp
          </a>

          <button id="cl">Chiudi</button>
        </div>
      `;

      $("cl").onclick = () => {
        $("notice").innerHTML = "";
      };
    }


    /* ============================================================
       ACTIONS
       ============================================================ */

    // Basic format check shared by both steps
    function checkCredentials(username, password) {
      if (!/^[a-z0-9_.-]{3,20}$/.test(username)) {
        return "Username: 3-20 caratteri (lettere, numeri, . _ -)";
      }
      if (password.length < 6) {
        return "Password: almeno 6 caratteri";
      }
      return null;
    }

    // Single entry point: try to sign in. If it fails, check the public
    // "players" collection to find out whether this username was already
    // registered by someone — that tells us the real reason, instead of
    // guessing from Firebase's (intentionally vague) sign-in error:
    //   - username already registered -> wrong password, say so, stop here
    //   - username not found anywhere -> genuinely new, go to nome/cognome
    async function continueAuth() {
      const username = $("u").value.trim().toLowerCase();
      const password = $("pw").value;

      const problem = checkCredentials(username, password);
      if (problem) return err(problem);

      try {
        await signInWithEmailAndPassword(auth, username + DOMAIN, password);
        // success: onAuthStateChanged takes over from here
        return;
      }
      catch (e) {
        // fall through to the existence check below
      }

      try {
        const snap = await getDoc(doc(db, "players", username));
        if (snap.exists()) {
          return err("Questo username è già registrato: controlla la password.");
        }
      }
      catch (e) {
        return err("Errore di rete, riprova.");
      }

      // Username not found anywhere — this really is a new account
      regUsername = username;
      regPassword = password;
      registerStep = true;
      render();
    }

    // Only reached for a genuinely new username. Creates the account —
    // the auth/email-already-in-use fallback here is just a safety net for
    // a rare race (two people registering the same username at once, or an
    // earlier registration that created the login but not the profile).
    async function finishRegister() {
      const nome = $("nome").value.trim();
      const cognome = $("cognome").value.trim();

      // Snapshot these now: the moment createUserWithEmailAndPassword
      // succeeds, onAuthStateChanged fires and resets regUsername/regPassword —
      // reading the shared variables again after that point would be empty.
      const username = regUsername;
      const password = regPassword;

      if (!nome || !cognome) {
        return err("Inserisci nome e cognome");
      }

      try {
        await createUserWithEmailAndPassword(auth, username + DOMAIN, password);
        await setDoc(doc(db, "players", username), { nome, cognome, username });
      }
      catch (e) {
        if (e.code === "auth/email-already-in-use") {
          registerStep = false;
          render();
          err("Username già registrato: controlla la password.");
        }
        else if (e.code === "auth/weak-password") {
          err("Password troppo debole");
        }
        else {
          err("Registrazione non riuscita");
        }
      }
    }

    async function join(role) {
      const old = entries.find(e => e.type === "member" && e.username === me);
      const myId = me;

      if (role === "player" && playerCountExcluding(myId) >= match.cap) {
        return err(`Il campo è pieno (${match.cap}/${match.cap}). Puoi iscriverti come sostituto.`);
      }

      await setDoc(doc(db, "entries", myId), {
        type: "member",
        username: me,
        role,
        ts: serverTimestamp()
      });

      // Re-derive locally (approximate) to word the WhatsApp message
      const simulated = entries
        .filter(e => e.id !== myId)
        .concat({ id: myId, type: "member", username: me, role, ts: Date.now() });
      const after = derive(simulated, match.cap);
      const isIn = after.conf.some(e => e.id === myId);

      if (role === "sub") {
        say(`${myDisplayName()} è sostituto. In campo ${after.conf.length}/${match.cap}.`);
      }
      else if (isIn) {
        say(`${myDisplayName()} ci sta! In campo ${after.conf.length}/${match.cap}.`);
      }
      else {
        say(`${myDisplayName()} è in lista d'attesa (campo pieno).`);
      }
    }

    async function leave() {
      const before = derive(entries, match.cap).conf.map(e => e.id);
      const after = derive(entries.filter(e => e.id !== me), match.cap);
      const promoted = after.conf.find(e => !before.includes(e.id));

      await deleteDoc(doc(db, "entries", me));

      const promotedText = (before.includes(me) && promoted)
        ? ` ${displayName(promoted)} entra dalla panchina!`
        : "";

      say(`${myDisplayName()} si è ritirato.${promotedText} In campo ${after.conf.length}/${match.cap}.`);
    }

    async function addGuest() {
      const nome = $("g_nome").value.trim();
      const cognome = $("g_cognome").value.trim();
      const role = $("g_role").value;

      if (!nome || !cognome) {
        return gerr("Inserisci nome e cognome");
      }
      if (role === "player" && playerCountExcluding(null) >= match.cap) {
        return gerr(`Il campo è pieno (${match.cap}/${match.cap}). Aggiungilo come sostituto.`);
      }

      const id = "guest_" + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);

      await setDoc(doc(db, "entries", id), {
        type: "guest",
        addedBy: me,
        nome,
        cognome,
        role,
        ts: serverTimestamp()
      });

      guestFormOpen = false;

      const simulated = entries.concat({ id, type: "guest", nome, cognome, role, ts: Date.now() });
      const after = derive(simulated, match.cap);
      const label = role === "sub" ? "sostituto" : "giocatore";

      say(`${myDisplayName()} ha aggiunto ${nome} ${cognome} (${label}). In campo ${after.conf.length}/${match.cap}.`);
    }

    // Exposed globally so the inline onclick="" in the list items can reach them
    window.__removeGuest = async function (id) {
      const g = entries.find(e => e.id === id);
      if (!g) return;

      const before = derive(entries, match.cap).conf.map(e => e.id);
      const after = derive(entries.filter(e => e.id !== id), match.cap);
      const promoted = after.conf.find(e => !before.includes(e.id));

      await deleteDoc(doc(db, "entries", id));

      const promotedText = (before.includes(id) && promoted)
        ? ` ${displayName(promoted)} entra dalla panchina!`
        : "";

      say(`${g.nome} ${g.cognome} è stato ritirato.${promotedText} In campo ${after.conf.length}/${match.cap}.`);
    };

    window.__toggleGuestRole = async function (id) {
      const g = entries.find(e => e.id === id);
      if (!g) return;

      const newRole = g.role === "sub" ? "player" : "sub";

      if (newRole === "player" && playerCountExcluding(id) >= match.cap) {
        return alert(`Il campo è pieno (${match.cap}/${match.cap}).`);
      }

      await updateDoc(doc(db, "entries", id), { role: newRole });

      say(`${g.nome} ${g.cognome} è passato a ${newRole === "sub" ? "sostituto" : "giocatore"}.`);
    };

    async function saveMatch(reset) {
      const m = {
        date: $("a_date").value,
        place: $("a_place").value.trim() || DEF.place,
        maps: $("a_maps").value.trim(),
        time: $("a_time").value.trim() || DEF.time,
        cap: Math.max(2, parseInt($("a_cap").value) || DEF.cap)
      };

      if (reset && !confirm("Azzerare tutti gli iscritti?")) {
        return;
      }

      try {
        await setDoc(doc(db, "match", "current"), m);

        if (reset) {
          const batch = writeBatch(db);
          entries.forEach(e => batch.delete(doc(db, "entries", e.id)));
          await batch.commit();
        }
      }
      catch (e) {
        return alert("Non autorizzato.");
      }

      const mapsText = m.maps ? ` 🗺️ ${m.maps}` : "";

      if (reset) {
        say(`${matchTitle(m.date)}. Chi gioca? ${location.href.split("#")[0]}${mapsText}`);
      }
      else {
        const weatherText = weather ? " Meteo: " + weather : "";
        say(`Aggiornamento ${matchTitle(m.date).toLowerCase()}: ${m.place}, ore ${m.time}. Giocatori: ${m.cap}.${weatherText}${mapsText}`);
      }
    }


    /* ============================================================
       WEATHER (Open-Meteo)
       ============================================================ */

    const WMO = code => {
      if (code === 0) return "☀️ sereno";
      if (code < 3)   return "⛅ poco nuvoloso";
      if (code < 49)  return "☁️ nuvoloso/nebbia";
      if (code < 70)  return "🌧️ pioggia";
      if (code < 80)  return "❄️ neve";
      return "⛈️ temporale";
    };

    async function loadWeather() {
      weather = "";

      try {
        const date = match.date;
        if (!date) return;

        const today = new Date().toISOString().slice(0, 10);
        const diffDays = (new Date(date) - new Date(today)) / 864e5;
        if (diffDays < 0 || diffDays > 15) return;

        const url = "https://api.open-meteo.com/v1/forecast"
          + `?latitude=${LAT}&longitude=${LON}`
          + "&hourly=temperature_2m,precipitation_probability,weather_code"
          + `&start_date=${date}&end_date=${date}`
          + "&timezone=auto";

        const response = await fetch(url);
        const data = await response.json();

        const hour = Math.min(23, parseInt(match.time) || 21);
        const H = data.hourly;

        weather = `${WMO(H.weather_code[hour])}, `
          + `${Math.round(H.temperature_2m[hour])}°C, `
          + `pioggia ${H.precipitation_probability[hour]}%`;
      }
      catch (e) {
        // no forecast available: just hide the weather box
      }

      render();
    }


    /* ============================================================
       LIVE LISTENERS
       ============================================================ */

    onAuthStateChanged(auth, user => {
      me = user ? user.email.split("@")[0] : null;
      guestFormOpen = false;
      registerStep = false;
      regUsername = "";
      regPassword = "";
      $("admin").dataset.on = "";
      $("notice").innerHTML = "";
      render();
    });

    onSnapshot(doc(db, "match", "current"), snap => {
      match = { ...DEF, ...(snap.exists() ? snap.data() : {}) };
      $("admin").dataset.on = "";
      render();
      loadWeather();
    });

    onSnapshot(collection(db, "entries"), snapshot => {
      entries = snapshot.docs.map(d => {
        const x = d.data();
        return {
          id: d.id,
          type: x.type || "member",
          role: x.role,
          ts: x.ts?.toMillis?.() ?? Date.now(),
          username: x.username,
          addedBy: x.addedBy,
          nome: x.nome,
          cognome: x.cognome
        };
      });
      render();
    });

    onSnapshot(collection(db, "players"), snapshot => {
      players = {};
      snapshot.docs.forEach(d => { players[d.id] = d.data(); });
      render();
    });

    render();
  </script>
</body>

</html>
